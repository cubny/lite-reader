# fly.toml app configuration file generated for lite-reader on 2026-05-18T18:44:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lite-reader'
primary_region = 'ams'

[build]

[env]
  HTTP_PORT = '8080'
  DB_PATH = '/data/agg.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'lite_reader_data'
  destination = '/data'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
