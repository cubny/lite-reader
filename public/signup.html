<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Lite Reader</title>
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    
    <div class="login-container">
        <h1>Sign Up for Lite Reader</h1>
        <div id="message-container"></div>
        <form class="login-form" 
              hx-post="/signup" 
              hx-target="#message-container"
              hx-swap="innerHTML"
              hx-indicator="#signup-spinner">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" class="form-control" required>
            </div>
            <button type="submit" class="btn-primary">
                Sign Up
                <span id="signup-spinner" class="htmx-indicator">...</span>
            </button>
        </form>
        <div style="text-align: center; margin-top: 20px;">
            <a href="/login.html" style="color: #6C8A46;">Already have an account? Log in</a>
        </div>
    </div>

    <script type="text/javascript" src="js/signup-htmx.js"></script>
</body>
</html>
