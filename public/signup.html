<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Lite Reader</title>
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
    
    <div class="login-container">
        <h1>Sign Up for Lite Reader</h1>
        <div id="message-container"></div>
        <form class="login-form" 
              hx-post="/signup" 
              hx-target="#message-container"
              hx-swap="innerHTML"
              hx-indicator="#signup-spinner">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" class="form-control" required>
            </div>
            <button type="submit" class="btn-primary">
                Sign Up
                <span id="signup-spinner" class="htmx-indicator">...</span>
            </button>
        </form>
        <div style="text-align: center; margin-top: 20px;">
            <a href="/login.html" style="color: #6C8A46;">Already have an account? Log in</a>
        </div>
    </div>

    <script>
        // Client-side password validation
        document.querySelector('.login-form').addEventListener('submit', function(evt) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const messageContainer = document.getElementById('message-container');
            
            // Clear previous messages
            messageContainer.innerHTML = '';
            
            // Validate password match
            if (password !== confirmPassword) {
                evt.preventDefault();
                messageContainer.innerHTML = '<div class="error-message">Passwords do not match</div>';
                return false;
            }
            
            // Validate password length
            if (password.length < 6) {
                evt.preventDefault();
                messageContainer.innerHTML = '<div class="error-message">Password must be at least 6 characters long</div>';
                return false;
            }
        });

        // Handle successful signup - redirect to login
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'message-container') {
                const response = evt.detail.xhr.responseText;
                // Check if signup was successful (look for success indicator)
                if (response.includes('data-success="true"')) {
                    sessionStorage.setItem('signupSuccess', 'true');
                    window.location.href = '/login.html';
                }
            }
        });
    </script>
</body>
</html>
